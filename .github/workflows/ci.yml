# Continuous integration: lint, the full test suite and the installation self-test on
# Windows, macOS and Linux for every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      RIS_DISABLE_KEYRING: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libfontconfig1 \
            libdbus-1-3 poppler-utils

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check ris tests scripts docs/tutorial

      - name: Test suite
        run: |
          mkdir -p build
          python -m pytest -q -p no:cacheprovider --junitxml=build/junit.xml

      - name: Report failed tests as annotations
        if: failure()
        run: python scripts/ci_annotate.py build/junit.xml

      - name: Installation self-test
        run: python run_application.py --selftest --report build/selftest.txt

      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            build/junit.xml
            build/selftest.txt
            build/test-results/
          if-no-files-found: ignore
