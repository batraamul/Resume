# Requirements register — source of truth.
# docs/REQUIREMENTS.md is generated from this file plus pytest results by
#   python scripts/trace_requirements.py
# Tests declare the requirement they provide evidence for with @pytest.mark.req("ID").
# Priority: P0 essential to a safe, usable first release; P1 important; P2 enhancement; P3 optional future work.

